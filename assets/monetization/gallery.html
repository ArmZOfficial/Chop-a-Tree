<!doctype html><html lang="th"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chop a Tree · Game Pass icons</title><style>
*{box-sizing:border-box}body{margin:0;background:#10251d;color:#edf5df;font:16px/1.55 "Segoe UI",Tahoma,sans-serif}main{max-width:1280px;margin:auto;padding:36px 24px}h1{font-size:42px;line-height:1.1;margin:8px 0 12px}.eyebrow{color:#e4b65c;font-size:13px;letter-spacing:.15em}header p{max-width:800px;color:#b8ccb5}.note{border-left:3px solid #e4b65c;padding:12px 18px;background:#193427;color:#e3d8b0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:18px;margin-top:26px}.card{background:#1b3629;border:1px solid #345643;border-radius:16px;padding:20px}.card img{display:block;width:220px;max-width:100%;height:auto;margin:0 auto 20px}h2{margin:0;font-size:23px}.thai{color:#b8ccb5;margin:4px 0 16px}.desc{font-size:14px;white-space:pre-wrap;color:#dce8d5}.label{color:#e4b65c;font-size:12px;letter-spacing:.08em}.actions{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0}button,.download{font:inherit;font-size:13px;border:1px solid #577459;border-radius:8px;padding:9px 12px;color:#edf5df;background:#2b5039;cursor:pointer;text-decoration:none}button:hover,.download:hover{background:#3a6646}.download{display:inline-block;background:#a57c27;border-color:#e4b65c}.price{font-size:12px;color:#b8ccb5}#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#e8bc65;color:#14281d;padding:12px 22px;border-radius:10px;display:none;max-width:90vw}details{border-top:1px solid #345643;padding-top:10px}summary{cursor:pointer;color:#b8ccb5}
</style><main><header><div class="eyebrow">CHOP A TREE / GAME PASSES</div><h1>ไอคอนพร้อมข้อความครบ 10 Pass</h1><p>PNG 512×512 · วงกลม · พื้นหลังโปร่งใส · กรอบทองและธีมแฟนตาซีป่า</p><p class="note">ชุดนี้เป็นงานภาพและร่างข้อความตามแผน ระบบสิทธิ์ Pass ยังไม่ได้เปิดในเกม โปรดใช้ข้อความขายเมื่อสิทธิ์นั้นพร้อมและผ่านการตรวจแล้ว</p></header><section class="grid" id="grid"></section></main><div id="toast" role="status" aria-live="polite"></div><script>
const passes=[{"id":"vip","name":"VIP","thaiName":"VIP แห่งพงไพร","price":249,"th":"เป็นนักผจญภัย VIP ใน Chop a Tree! รับฉายา VIP สีแชทพิเศษ สิทธิ์เข้าห้อง VIP ในหมู่บ้าน และช่องรางวัล Daily เพิ่ม 1 ช่อง ซื้อครั้งเดียว ใช้ได้ถาวร","en":"Become a VIP adventurer in Chop a Tree! Unlock a VIP title, a special chat color, access to the village VIP room, and one extra Daily reward slot. One purchase, permanent access.","icon":"icons/01-vip.png"},{"id":"wood-2x","name":"2x Wood","thaiName":"ไม้ ×2","price":299,"th":"ฟันต้นไม้ให้คุ้มทุกครั้ง! รับ Wood เป็น 2 เท่าแบบถาวรใน Chop a Tree แล้วนำไปอัปเกรดสวน ตู้ฟัก และฐาน โบนัส Wood ถาวรชนิดเดียวกันใช้ค่าที่สูงที่สุด ไม่คูณซ้อนกัน","en":"Make every chop count! Collect 2x Wood permanently in Chop a Tree and put it toward your garden, incubator, and base upgrades. Permanent Wood bonuses use the highest applicable value and do not multiply together.","icon":"icons/02-wood-2x.png"},{"id":"coins-2x","name":"2x Coins","thaiName":"เหรียญ ×2","price":299,"th":"เก็บ Coins จากรางวัลป่าเป็น 2 เท่าแบบถาวร! สะสมเงินไว้ซื้อไข่และพัฒนาฐานใน Chop a Tree โบนัส Coins ถาวรชนิดเดียวกันใช้ค่าที่สูงที่สุด ไม่คูณซ้อนกัน","en":"Earn 2x Coins from forest rewards permanently! Save up for eggs and grow your home in Chop a Tree. Permanent Coin bonuses use the highest applicable value and do not multiply together.","icon":"icons/03-coins-2x.png"},{"id":"lucky","name":"Lucky","thaiName":"โชคแห่งป่า","price":399,"th":"เพิ่มโอกาสได้อาวุธ Epic ขึ้นไปจากหีบอีก 25% เมื่อเทียบกับโอกาสเดิม! เช่น โอกาส 4% จะเพิ่มเป็น 5% โบนัสโชคถาวรรวมสูงสุด +25% ไม่รับประกันว่าจะได้ของหายากทุกครั้ง","en":"Boost your chance of finding Epic or higher weapons in chests by 25% relative to the base odds! For example, 4% becomes 5%. Permanent Luck bonuses are capped at +25%. Rare drops are not guaranteed.","icon":"icons/04-lucky.png"},{"id":"pet-slots","name":"+2 Pet Slots","thaiName":"เพื่อนร่วมทาง +2","price":349,"th":"พกสัตว์เลี้ยงร่วมผจญภัยเพิ่มอีก 2 ตัว! จัดทีมเพื่อนตัวโปรดเพื่อช่วยฟันต้นไม้และออกสำรวจ Chop a Tree จำนวนสัตว์ที่พกได้รวมสูงสุด 6 ตัวตามเพดานเกม","en":"Bring two more pets along on your adventure! Build a team of your favorite companions for chopping and exploring Chop a Tree. Equipped pets remain capped at six in total.","icon":"icons/05-pet-slots.png"},{"id":"hatch-2x","name":"2x Hatch Speed","thaiName":"ฟักไว ×2","price":249,"th":"รอเพื่อนตัวใหม่ไม่นาน! ไข่ในตู้ฟักฟักเร็วขึ้นเป็น 2 เท่าใน Chop a Tree โบนัสความเร็วถาวรชนิดเดียวกันใช้ค่าที่สูงที่สุด ไม่คูณซ้อนกับอัปเกรดตู้ฟัก","en":"Meet your new pets sooner! Hatch incubator eggs twice as fast in Chop a Tree. Permanent hatch-speed bonuses use the highest applicable value and do not multiply with incubator upgrades.","icon":"icons/06-hatch-2x.png"},{"id":"garden-slots","name":"+10 Garden Plots","thaiName":"สวนใหญ่ +10","price":249,"th":"ขยายสวนด้วยช่องปลูกเพิ่ม 10 ช่อง! ปลูกผลไม้ให้หลากหลายและสร้างสวนในฝันของคุณใน Chop a Tree จำนวนช่องปลูกรวมยังอยู่ภายใต้เพดานของเกม","en":"Grow your dream garden with ten additional planting slots! Plant more varieties and make your home bloom in Chop a Tree. Total planting slots remain subject to the game's capacity limit.","icon":"icons/07-garden-slots.png"},{"id":"auto-sell","name":"Auto Sell","thaiName":"ขายอัตโนมัติ","price":149,"th":"ผจญภัยต่อได้อย่างสะดวก! เปิดระบบขายผลไม้และ Wood อัตโนมัติใน Chop a Tree ลดการเดินกลับร้าน ระบบขายใช้ราคาปกติของเกม ไม่เพิ่มมูลค่าของไอเทม","en":"Keep your adventure moving! Enable automatic selling for fruit and Wood in Chop a Tree and spend less time returning to the shop. Items sell at their normal in-game prices.","icon":"icons/08-auto-sell.png"},{"id":"teleport","name":"Teleport Anywhere","thaiName":"วาร์ปได้ทุกที่","price":199,"th":"เดินทางไวด้วยเมนูวาร์ป! วาร์ปจากจุดที่ระบบอนุญาตไปยังโซนที่คุณปลดล็อกแล้วใน Chop a Tree ไม่ข้ามเงื่อนไขเนื้อเรื่องหรือข้อจำกัดขณะถือไข่","en":"Travel quickly with the teleport menu! Warp from permitted locations to zones you have already unlocked in Chop a Tree. Story requirements and egg-carry restrictions still apply.","icon":"icons/09-teleport.png"},{"id":"multi-open","name":"Open 10 Chests","thaiName":"เปิดหีบ ×10","price":149,"th":"เปิดหีบพร้อมกันได้สูงสุด 10 ใบ! จัดการหีบที่สะสมจากการผจญภัยใน Chop a Tree ได้สะดวกขึ้น ต้องมีหีบและพื้นที่กระเป๋าเพียงพอ การเปิดหลายใบไม่เปลี่ยนโอกาสดรอป","en":"Open up to ten chests at once! Clear your adventure haul faster in Chop a Tree. You need enough owned chests and inventory space. Multi-open does not change drop rates.","icon":"icons/10-multi-open.png"}];
const esc=s=>s.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const grid=document.querySelector("#grid");passes.forEach((p,i)=>{const card=document.createElement("article");card.className="card";card.innerHTML=`<img src="${esc(p.icon)}" alt="${esc(p.name)} icon"><h2>${esc(p.name)}</h2><p class="thai">${esc(p.thaiName)}</p><div class="label">ENGLISH DESCRIPTION</div><p class="desc">${esc(p.en)}</p><div class="actions"><button data-copy="name">คัดลอกชื่อ</button><button data-copy="en">คัดลอกอังกฤษ</button><button data-copy="th">คัดลอกไทย</button></div><details><summary>ดูคำอธิบายไทย</summary><p class="desc">${esc(p.th)}</p></details><p class="price">ราคาในแผน: ${p.price} Robux · ยังไม่ได้ตั้งขาย</p><a class="download" href="${esc(p.icon)}" download>ดาวน์โหลด PNG</a>`;card.querySelectorAll("button").forEach(b=>b.addEventListener("click",()=>copy(p[b.dataset.copy])));grid.append(card);});
async function copy(text){let ok=false;try{if(navigator.clipboard){await navigator.clipboard.writeText(text);ok=true;}}catch{}if(!ok){const t=document.createElement("textarea");t.value=text;t.style.position="fixed";t.style.left="0";t.style.top="0";document.body.append(t);t.select();ok=document.execCommand("copy");if(ok)t.remove();else{notice("เลือกข้อความไว้แล้ว กด Ctrl+C เพื่อคัดลอก");return;}}notice("คัดลอกแล้ว");}let timer;function notice(s){const toast=document.querySelector("#toast");toast.textContent=s;toast.style.display="block";clearTimeout(timer);timer=setTimeout(()=>toast.style.display="none",2800);}
</script></html>
